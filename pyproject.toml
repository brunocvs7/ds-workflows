[project]
name = "ds-conformance"
version = "1.0.0"
description = "Verificações de conformidade para projetos criados a partir do ds-project-template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ds-check = "ds_conformance.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_conformance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
