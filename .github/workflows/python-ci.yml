# Workflow reutilizável. Uso no repo do projeto:
#
#   jobs:
#     ci:
#       uses: brunocvs7/ds-workflows/.github/workflows/python-ci.yml@v1
#
# O job do chamador DEVE se chamar `ci`: os checks obrigatórios do ruleset são
# `ci / lint`, `ci / test`, `ci / conformance` e `ci / branch-name`.
name: python-ci

on:
  workflow_call:
    inputs:
      run-conformance:
        description: "Roda as verificações de conformidade de projeto DS"
        type: boolean
        default: true
      conformance-ref:
        description: "Versão (tag/branch) do ds-workflows usada pelo ds-check"
        type: string
        default: v1
      branch-pattern:
        description: "Regex que a branch de origem do PR precisa seguir"
        type: string
        default: '^(feature|fix|hotfix|refactor|experiment|docs|chore|test|ci)/[a-z0-9][a-z0-9._/-]*$'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pre-commit (ruff, nbstripout, arquivos grandes, uv.lock...)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  conformance:
    name: conformance
    if: inputs.run-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Dependências declaradas (deptry)
        run: uv run --with deptry deptry src
      - name: ds-check (estrutura, dados, notebooks, testes, pipeline)
        run: uvx --from "git+https://github.com/brunocvs7/ds-workflows@${{ inputs.conformance-ref }}" ds-check

  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar nome da branch de origem
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          PATTERN: ${{ inputs.branch-pattern }}
        run: |
          if [ "$BASE" != "$DEFAULT" ]; then
            echo "PR para '$BASE' (não é a branch padrão) — regra não se aplica."
            exit 0
          fi
          if [[ "$HEAD" =~ $PATTERN ]]; then
            echo "OK: '$HEAD'"
          else
            echo "::error::Branch '$HEAD' fora do padrão. Use <tipo>/<descricao>, com tipo em: feature, fix, hotfix, refactor, experiment, docs, chore, test, ci."
            exit 1
          fi
